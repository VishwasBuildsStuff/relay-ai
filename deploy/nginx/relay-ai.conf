# Install in nginx's http configuration directory (commonly /etc/nginx/conf.d/).
# Also install relay-ai-proxy-location.conf at /etc/nginx/snippets/.
limit_req_zone $binary_remote_addr zone=relay_ai_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=relay_ai_connections:10m;

upstream relay_ai_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name relay.example.com;
    if ($host != relay.example.com) { return 400; }
    return 308 https://relay.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name relay.example.com;

    if ($host != relay.example.com) { return 400; }

    ssl_certificate /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 15s;
    client_max_body_size 1m;

    # Install the Vite production build at this path. API traffic stays on the
    # same public origin and is forwarded to the loopback-only FastAPI service.
    root /opt/relay-ai/dist;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; upgrade-insecure-requests" always;

    limit_conn relay_ai_connections 20;
    limit_conn_status 429;
    limit_req zone=relay_ai_requests burst=40 nodelay;
    limit_req_status 429;

    location ^~ /api/ {
        include /etc/nginx/snippets/relay-ai-proxy-location.conf;
    }

    location = /ready {
        include /etc/nginx/snippets/relay-ai-proxy-location.conf;
    }
    location = /health {
        include /etc/nginx/snippets/relay-ai-proxy-location.conf;
    }
    location = /metrics {
        include /etc/nginx/snippets/relay-ai-proxy-location.conf;
    }

    location = /api/v1/tasks {
        client_max_body_size 10m;
        include /etc/nginx/snippets/relay-ai-proxy-location.conf;
    }
    location = /tasks/report {
        client_max_body_size 10m;
        include /etc/nginx/snippets/relay-ai-proxy-location.conf;
    }

    location = /api/v1/tasks/upload {
        client_max_body_size 27m;
        proxy_request_buffering off;
        include /etc/nginx/snippets/relay-ai-proxy-location.conf;
    }
    location = /tasks/submit {
        client_max_body_size 27m;
        proxy_request_buffering off;
        include /etc/nginx/snippets/relay-ai-proxy-location.conf;
    }

    location = /tasks {
        include /etc/nginx/snippets/relay-ai-proxy-location.conf;
    }
    location ^~ /tasks/ {
        include /etc/nginx/snippets/relay-ai-proxy-location.conf;
    }
    location = /scenarios {
        include /etc/nginx/snippets/relay-ai-proxy-location.conf;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
